services:
  postgres:
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: vortex_marketplace
      POSTGRES_USER: vortex
      POSTGRES_PASSWORD: vortex
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vortex -d vortex_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
